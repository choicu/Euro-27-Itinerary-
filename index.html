<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Day-by-day trip guide for Europe 2027.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>Europe 2027</title>
  <link id="app-manifest" rel="manifest" href="manifest.webmanifest">
  <script src="manifest-switch.js"></script>
  <meta name="theme-color" content="#0f3d5e">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="data.js">
  <link rel="modulepreload" href="icons.js">
</head>
<body class="on-today">
  <div class="topbar">
    <div class="topbar-row">
      <h1 id="topbar-title">Europe 2027</h1>
      <button type="button" id="group-chip" class="group-chip" hidden></button>
      <div class="day-nav" id="day-nav">
        <button id="day-prev" aria-label="Previous day"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></button>
        <button id="day-today" class="today-btn" hidden>Today</button>
        <button id="day-next" aria-label="Next day"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="day-strip" id="day-strip"></div>
  </div>

  <div id="screen-today" class="screen active">
    <div id="countdown-banner"></div>
    <div class="day-header" id="day-header"></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div id="screen-overview" class="screen">
    <div id="overview-list" class="overview-list"></div>
  </div>

  <div id="screen-places" class="screen">
    <div class="places-filter" id="places-filter"></div>
    <div id="places-list"></div>
  </div>

  <div id="screen-search" class="screen">
    <div class="search-bar">
      <input id="search-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search days and places" aria-label="Search days and places">
    </div>
    <div id="search-results" class="search-results" aria-live="polite"></div>
  </div>

  <div id="screen-handy" class="screen">
    <div id="handy-list" class="handy-list"></div>
  </div>

  <button class="sync-footer" id="sync-footer" type="button">Loading…</button>

  <div id="install-tip" class="install-tip" role="dialog" aria-label="Add this guide to your home screen" hidden></div>

  <div id="group-picker" class="group-picker" hidden></div>

  <nav class="bottom-nav">
    <button data-screen="today" class="active"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Today</span></button>
    <button data-screen="overview"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/></svg><span>Route</span></button>
    <button data-screen="places"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>Places</span></button>
    <button data-screen="search"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Search</span></button>
    <button data-screen="handy"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Handy</span></button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
